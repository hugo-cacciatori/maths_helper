[package]
name = "algo-visual"
version = "0.1.0"
description = "Interactive algorithm-analysis lessons"
edition = "2024"
rust-version = "1.90"

[lib]
name = "algo_visual_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
